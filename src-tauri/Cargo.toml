[package]
name = "pixel-cutout-sprite-studio"
version = "0.1.0"
description = "Offline-first desktop studio for deterministic pixel cutout animation"
authors = ["PixelCutoutSprite contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "pixel_cutout_sprite_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.1", features = [] }

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }

[package.metadata.template_tooling]
profile = "desktop-local"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
