[package]
name = "pixel-cutout-sprite-studio"
version = "0.1.0"
description = "Offline-first desktop studio for deterministic pixel cutout animation"
authors = ["PixelCutoutSprite contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "pixel_cutout_sprite_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.6.0"
thiserror = "2.0.18"
unicode-normalization = "0.1.25"
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }
tempfile = "3.23.0"

[package.metadata.template_tooling]
profile = "desktop-local"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
